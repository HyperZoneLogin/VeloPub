name: Build and publish Velocity

on:
  push:
    branches:
      - main
    paths:
      - velocity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_MAVEN_URL: ${{ secrets.MAVEN_URL }}
      ORG_GRADLE_PROJECT_MAVEN_USER: ${{ secrets.MAVEN_USER }}
      ORG_GRADLE_PROJECT_MAVEN_PASS: ${{ secrets.MAVEN_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with: 
          cache-provider: basic

      - name: Build and publish
        working-directory: velocity
        run: >-
          ./gradlew --no-daemon
          -I ../publish.gradle.kts
          build
          :velocity-api:publish
          :velocity-native:publish
          :velocity-proxy:publish
